<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}InterviewCoach: Calm, focused interview practice{% endblock %}</title>
  <meta name="description" content="InterviewCoach is a calm, supportive coach: paste a job description, practise role-specific questions, and get encouraging, rubric-based feedback on every answer. Runs with zero API keys." />

  <!-- Vendored offline: Tailwind (Play CDN, JIT) + htmx. No network required. -->
  <script src="/static/vendor/tailwind.js"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            // Offline-first: a calm, modern system sans stack, no web-font CDN.
            sans: ['"Inter var"', "Inter", "ui-sans-serif", "system-ui",
                   "-apple-system", "Segoe UI", "Roboto", "Helvetica", "Arial", "sans-serif"],
          },
          colors: {
            // Calm Coach: teal as the steady primary voice.
            brand: {
              50: "#f0fdfa", 100: "#ccfbf1", 200: "#99f6e4", 300: "#5eead4",
              400: "#2dd4bf", 500: "#14b8a6", 600: "#0d9488", 700: "#0f766e",
              800: "#115e59", 900: "#134e4a",
            },
            // Sage: a soft, reassuring supporting green.
            sage: {
              50: "#f3f6f2", 100: "#e3ebe0", 200: "#c8d8c2", 300: "#a4bd9b",
              400: "#7c9d70", 500: "#5e8050", 600: "#49663e", 700: "#3b5233",
              800: "#31432c", 900: "#293826",
            },
            // Soft blue: calm, trustworthy accent for highlights.
            sky2: {
              50: "#f0f7fb", 100: "#dcecf6", 200: "#bcdaec", 300: "#8fc0dd",
              400: "#5b9fc8", 500: "#3a82b3", 600: "#2c6896", 700: "#26547a",
              800: "#244765", 900: "#223c56",
            },
          },
        },
      },
    };
  </script>
  <script src="/static/vendor/htmx.min.js" defer></script>

  <link rel="stylesheet" href="/static/css/app.css" />
  <script src="/static/js/app.js"></script>

  <!-- Calm coaching mark: a steady, centred compass dot. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230d9488' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='9'/><path d='M12 7v5l3 2'/></svg>" />
</head>
<body class="ic-bg min-h-screen bg-stone-50 text-stone-800 dark:bg-[#0c1413] dark:text-stone-200 antialiased flex flex-col">

  {% include "partials/nav.html" %}

  <main class="mx-auto w-full max-w-6xl flex-1 px-4 sm:px-6 lg:px-8 py-8 sm:py-10">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}

</body>
</html>
