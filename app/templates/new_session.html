{% extends "base.html" %}
{% block title %}New session · InterviewCoach{% endblock %}
{% block content %}
<section class="mx-auto max-w-3xl">
  <a href="/dashboard" class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 transition hover:text-brand-600 dark:text-slate-400 dark:hover:text-brand-400">
    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Back to dashboard
  </a>

  <div class="mt-4">
    <h1 class="text-3xl font-bold tracking-tight">New practice session</h1>
    <p class="mt-2 text-slate-600 dark:text-slate-300">
      Paste a real job description — the more detail, the more role-specific your questions will be.
    </p>
  </div>

  {% if error %}
  <div class="mt-5 flex items-start gap-2 rounded-lg border border-rose-300/60 bg-rose-50 px-3.5 py-2.5 text-sm text-rose-700 dark:border-rose-500/30 dark:bg-rose-500/10 dark:text-rose-300">
    <svg class="mt-0.5 h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span>{{ error }}</span>
  </div>
  {% endif %}

  <form method="post" action="/sessions" class="ic-card mt-6 space-y-5 p-6 sm:p-7">
    <div>
      <div class="flex items-center justify-between">
        <label for="jd" class="block text-sm font-medium text-slate-700 dark:text-slate-200">Job description</label>
        <button type="button"
                onclick="document.getElementById('jd').value = this.getAttribute('data-jd'); document.getElementById('jd').focus();"
                data-jd="{{ sample_jd }}"
                class="inline-flex items-center gap-1.5 rounded-md px-2 py-1 text-xs font-medium text-brand-600 transition hover:bg-brand-50 dark:text-brand-400 dark:hover:bg-brand-500/10">
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Load a sample
        </button>
      </div>
      <textarea id="jd" name="job_description" rows="12" required
        placeholder="Paste the full job description here…"
        class="ic-focus mt-1.5 w-full resize-y rounded-lg border border-slate-300 bg-white px-3.5 py-3 text-sm leading-relaxed text-slate-800 placeholder:text-slate-400 focus:border-brand-500 focus:ring-0 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">{{ request.query_params.get('jd', '') }}</textarea>
    </div>

    <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
      <div class="w-full sm:w-48">
        <label for="qc" class="block text-sm font-medium text-slate-700 dark:text-slate-200">Number of questions</label>
        <select id="qc" name="question_count"
                class="ic-focus mt-1.5 w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-sm text-slate-800 focus:border-brand-500 focus:ring-0 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
          {% for n in [3, 4, 5, 6, 8] %}
            <option value="{{ n }}" {% if n == 5 %}selected{% endif %}>{{ n }} questions</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit"
              class="ic-focus inline-flex w-full items-center justify-center gap-2 rounded-lg bg-brand-600 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-700 sm:w-auto">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v4M3 5h4M6 17v4M4 19h4M13 3l1.9 5.1L20 10l-5.1 1.9L13 17l-1.9-5.1L6 10l5.1-1.9L13 3z"/></svg>
        Generate questions
      </button>
    </div>
  </form>
</section>
{% endblock %}
